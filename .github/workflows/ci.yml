name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.13']
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Node.js for cross-language tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: wrapped-website/package-lock.json

      - name: Install Wrapped website dependencies
        working-directory: wrapped-website
        run: npm ci

      - name: Install Python dependencies
        run: uv sync --locked --dev --python '${{ matrix.python-version }}'

      - name: Lint Python
        run: uv run --locked ruff check .

      - name: Test Python
        run: uv run --locked pytest -q

  wrapped-website:
    name: Wrapped website
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: wrapped-website/package-lock.json

      - name: Install dependencies
        working-directory: wrapped-website
        run: npm ci

      - name: Test
        working-directory: wrapped-website
        run: npm test

      - name: Typecheck
        working-directory: wrapped-website
        run: npm run typecheck

      - name: Lint
        working-directory: wrapped-website
        run: npm run lint

      # Blocks only on high/critical advisories in what the Worker ships.
      # Moderate and dev-only advisories don't block, so a newly published
      # advisory in a dev tool can't turn every PR red. Run `npm audit`
      # locally to see them.
      - name: Audit production dependencies (high/critical)
        working-directory: wrapped-website
        run: npm audit --omit=dev --audit-level=high
