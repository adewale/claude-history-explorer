name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.13']
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Node.js for cross-language tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: wrapped-website/package-lock.json

      - name: Install Wrapped website dependencies
        working-directory: wrapped-website
        run: npm ci

      - name: Install Python dependencies
        run: uv sync --locked --dev --python '${{ matrix.python-version }}'

      - name: Lint Python
        run: uv run --locked ruff check .

      - name: Test Python
        run: uv run --locked pytest -q

  wrapped-website:
    name: Wrapped website
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: wrapped-website/package-lock.json

      - name: Install dependencies
        working-directory: wrapped-website
        run: npm ci

      - name: Test
        working-directory: wrapped-website
        run: npm test

      - name: Typecheck
        working-directory: wrapped-website
        run: npm run typecheck

      - name: Lint
        working-directory: wrapped-website
        run: npm run lint

      # Blocks only on high/critical advisories in what the Worker ships.
      # Moderate and dev-only advisories don't block, so a newly published
      # advisory in a dev tool can't turn every PR red. Run `npm audit`
      # locally to see them.
      - name: Audit production dependencies (high/critical)
        working-directory: wrapped-website
        run: npm audit --omit=dev --audit-level=high
