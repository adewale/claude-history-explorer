name: Dependency audit

# Full npm audit (all severities, dev dependencies included) on a schedule,
# so advisories are reported without blocking unrelated PRs. ci.yml still
# blocks on high/critical advisories in production dependencies.
# A failed scheduled run is the signal: GitHub notifies about it, and the
# fix is usually `npm audit fix` or a dependency bump in wrapped-website/.

on:
  schedule:
    - cron: '23 6 * * 1'  # Mondays 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit (wrapped-website)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Audit all dependencies
        working-directory: wrapped-website
        run: npm audit
