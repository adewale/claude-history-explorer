[project]
name = "claude-history-explorer"
version = "0.2.1"
description = "CLI tool to explore Claude Code conversation history"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "sparklines>=0.4.0",
    "msgpack>=1.0.0",
    "pyperclip>=1.8.0",
]

[project.scripts]
claude-history = "claude_history_explorer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claude_history_explorer"]

[dependency-groups]
dev = [
    "hypothesis>=6.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=7.0.0",
    "ruff==0.16.0",
]

[tool.ruff]
required-version = "==0.16.0"

[tool.ruff.lint.per-file-ignores]
# These reports deliberately use the user's local calendar year; the persisted
# Claude history schema itself contains timezone-naive timestamps.
"claude_history_explorer/cli.py" = ["DTZ005"]
"claude_history_explorer/wrapped.py" = ["DTZ005", "DTZ011", "TRY004"]
# Test fixtures mirror that persisted schema, and nested patch contexts make
# setup/teardown ownership explicit.
"tests/**/*.py" = ["DTZ001", "DTZ005", "SIM102", "SIM117"]
